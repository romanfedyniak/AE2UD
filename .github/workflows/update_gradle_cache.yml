# Warms the Gradle cache when the build itself changes, so the next ordinary build starts from a
# populated one rather than downloading everything again.
name: Update Gradle Cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gradle**" # covers gradle folder, gradle.properties, gradlew
      - "build.gradle*"
      - "settings.gradle*"
      - "src/main/resources/*_at.cfg" # access transformers

jobs:
  Update_Cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21' # the Gradle process only; the mod still compiles to Java 8 bytecode

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
          gradle-home-cache-includes: |
            caches
            jdks
            notifications
            wrapper
          cache-write-only: true

      # No daemon: this job runs one Gradle command and then the runner is thrown away.
      - name: Update Cache
        run: ./gradlew test --build-cache --no-daemon
